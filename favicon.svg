<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="bg">
      <rect width="32" height="32" rx="4"/>
    </clipPath>
  </defs>
  <!-- Molokai dark background -->
  <rect width="32" height="32" rx="4" fill="#1b1d1e"/>
  <!-- Powerline arrow: arms extended to left edge, filled Molokai purple -->
  <polygon clip-path="url(#bg)"
           points="0,0 20,16 0,32"
           fill="#fd971f"/>
</svg>
